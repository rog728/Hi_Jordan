<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Styles/yes.css">
    <!-- Include any additional stylesheets or meta tags here -->
     <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <div class="container">
        <div>
            <h1 class="header_text">I was really hoping you'd click yes!!</h1>
        </div>
        <div class="gif_container">
            <img src="https://media.tenor.com/TEC6z0acIbUAAAAj/cute-bears-love.gif" alt="Cute animated illustration" style="margin-top: -30px; width: 500px;">
        </div>
        <!-- Adjusted position of the text element by 100px -->
        <p class="text" style="margin-top: 30px;">You're now my valentine baddie!!<br>I'm so excited to see you. 
        </p>
    </div>

    <div class="hearts"></div>

    <!-- Note: Positioned at the bottom near the footbar -->
    <p style="position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); text-align: center; color: #777;"></p>

    <!-- Include any external scripts if needed -->
    <script>
        window.addEventListener('load', function() {
            confetti({
                particleCount: 200,
                scalar: 1.5,
                spread: 360
            });

            for (let i = 0; i < 50; i++) {
                let heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 10 + 's';
                document.querySelector('.hearts').appendChild(heart);
            }
        });
    </script>
</body>
</html>
